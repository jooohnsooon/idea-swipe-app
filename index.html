<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IdeaSwipe</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <h1 class="logo">💡 IdeaSwipe</h1>
      <button class="results-btn" id="resultsBtn">結果を見る</button>
    </header>

    <!-- Swipe Screen -->
    <main class="swipe-screen" id="swipeScreen">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <p class="progress-text" id="progressText"></p>

      <div class="card-stack" id="cardStack">
        <!-- Cards injected by JS -->
      </div>

      <div class="swipe-hint left-hint" id="leftHint">👎 微妙</div>
      <div class="swipe-hint right-hint" id="rightHint">👍 良い!</div>

      <div class="action-buttons">
        <button class="action-btn bad-btn" id="badBtn" title="微妙">✕</button>
        <button class="action-btn undo-btn" id="undoBtn" title="元に戻す">↩</button>
        <button class="action-btn good-btn" id="goodBtn" title="良い!">♥</button>
      </div>
    </main>

    <!-- Empty State -->
    <div class="empty-screen hidden" id="emptyScreen">
      <div class="empty-content">
        <div class="empty-icon">🎉</div>
        <h2>全部チェックしました!</h2>
        <p>判定が完了しました。<br>結果を確認しましょう。</p>
        <button class="primary-btn" id="viewResultsBtn">結果を見る</button>
        <button class="secondary-btn" id="resetBtn">最初からやり直す</button>
      </div>
    </div>

    <!-- Results Screen -->
    <div class="results-screen hidden" id="resultsScreen">
      <div class="results-header">
        <button class="back-btn" id="backBtn">← 戻る</button>
        <h2>判定結果</h2>
        <button class="clear-btn" id="clearBtn">クリア</button>
      </div>

      <div class="results-stats" id="resultsStats"></div>

      <div class="results-tabs">
        <button class="tab active" data-tab="good">👍 良い</button>
        <button class="tab" data-tab="bad">👎 微妙</button>
        <button class="tab" data-tab="all">全て</button>
      </div>

      <div class="results-list" id="resultsList"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
